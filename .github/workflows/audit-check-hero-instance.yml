name: audit-check-hero-instance
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch every live page
        run: |
          pages="/ /what-we-do /websites-and-ai /evidence /about-us /book-a-30-minute-conversation /useful-thinking /owner-check /owner-dependency-quiz /market-ready-test /commercial-gaps-review /business-consultant-devon"
          mkdir -p pages_html
          for p in $pages; do
            fname=$(echo "$p" | tr '/' '_')
            curl -s "https://www.arringtonconsultancy.com${p}" -o "pages_html/${fname}.html"
          done
      - name: Show real quoted context around every fire/fires/firefighting hit
        run: |
          for f in pages_html/*.html; do
            grep -oiE '.{0,60}\bfire(fighting|s)?\b.{0,60}' "$f" | while read -r line; do
              echo "[$f] $line"
            done
          done
      - name: Show real quoted context for banned-unless-tactical words on evidence + websites-and-ai
        run: |
          for f in pages_html/_evidence.html pages_html/_websites-and-ai.html; do
            grep -oiE '.{0,60}\b(solutions?|synergy|leverage|empowe?r|journey|holistic|tailored|bespoke|coaching|transformational)\b.{0,60}' "$f" | while read -r line; do
              echo "[$f] $line"
            done
          done
