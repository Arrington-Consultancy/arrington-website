name: security-check
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: HTTP -> HTTPS redirect + all bound domains
        run: |
          echo "=== http (port 80) redirect ==="
          curl -s -o /dev/null -w "http://arringtonconsultancy.com -> %{http_code} redirect_url=%{redirect_url}\n" http://arringtonconsultancy.com
          curl -s -o /dev/null -w "http://www.arringtonconsultancy.com -> %{http_code} redirect_url=%{redirect_url}\n" http://www.arringtonconsultancy.com
          echo
          echo "=== TLS + status on every bound domain ==="
          for d in www.arringtonconsultancy.com arringtonconsultancy.com www.arringtonconsultancy.co.uk arringtonconsultancy.co.uk; do
            echo "--- $d ---"
            curl -sv -o /dev/null "https://$d" 2>&1 | grep -E 'SSL connection|subject:|expire date|HTTP/[12]' | head -6
          done
      - name: Security headers on main page
        run: |
          curl -sD - -o /dev/null https://www.arringtonconsultancy.com/
      - name: Security headers + CSP on standalone pages with inline style= attributes
        run: |
          for p in market-ready-test commercial-gaps-review owner-dependency-quiz owner-check; do
            echo "=== /$p ==="
            curl -sD - -o /dev/null "https://www.arringtonconsultancy.com/$p" | grep -i "content-security-policy\|^HTTP"
            echo
          done
      - name: Cookie flags (Set-Cookie on a fresh session)
        run: |
          curl -sD - -o /dev/null -c - https://www.arringtonconsultancy.com/login | grep -i "set-cookie\|^HTTP"
      - name: Sensitive path exposure
        run: |
          for p in /.env /.git/config /.git/HEAD /package.json /db/pool.js /server.js /.aws/credentials /wp-login.php /.DS_Store /config.json /backup.sql /node_modules/.bin; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.arringtonconsultancy.com$p")
            echo "$p -> $code"
          done
      - name: Admin API auth gating (should never return 200 with data unauthenticated)
        run: |
          for p in /api/admin/leads /api/admin/pages /api/admin/backup /api/content/contact /api/admin/permissions /api/admin/users; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.arringtonconsultancy.com$p")
            echo "GET $p -> $code"
          done
      - name: Error handling / stack trace leakage on a nonexistent route
        run: |
          curl -s https://www.arringtonconsultancy.com/this-route-should-not-exist-xyz123 | head -c 1500
          echo
          echo "--- status ---"
          curl -s -o /dev/null -w "%{http_code}\n" https://www.arringtonconsultancy.com/this-route-should-not-exist-xyz123
      - name: robots.txt and sitemap.xml content
        run: |
          echo "=== robots.txt ==="
          curl -s https://www.arringtonconsultancy.com/robots.txt
          echo
          echo "=== sitemap.xml (first 40 lines) ==="
          curl -s https://www.arringtonconsultancy.com/sitemap.xml | head -40
      - name: market-ready-test honeypot field actual rendered CSS visibility
        run: |
          curl -s https://www.arringtonconsultancy.com/market-ready-test -o mrt.html
          echo "=== inline style= attributes found in served HTML ==="
          grep -oE '<[a-z]+[^>]*style="[^"]*"[^>]*>' mrt.html | head -10
