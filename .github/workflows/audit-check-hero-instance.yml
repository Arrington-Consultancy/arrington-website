name: audit-check-hero-instance
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch every live page and strip to visible text
        run: |
          pages="/ /what-we-do /websites-and-ai /evidence /about-us /book-a-30-minute-conversation /useful-thinking /owner-check /owner-dependency-quiz /market-ready-test /commercial-gaps-review /business-consultant-devon"
          mkdir -p pages_html
          for p in $pages; do
            fname=$(echo "$p" | tr '/' '_')
            curl -s "https://www.arringtonconsultancy.com${p}" -o "pages_html/${fname}.html"
          done
          ls -la pages_html/
      - name: Grep every page for Brand OS banned language
        run: |
          echo "=== fire metaphors (firefighting, fires, blaze, extinguish) ==="
          grep -linE '\bfire(fighting|s)?\b|\bblaze\b|\bextinguish' pages_html/*.html || echo "none found"
          echo
          echo "=== em dashes ==="
          grep -lP '—' pages_html/*.html || echo "none found"
          echo
          echo "=== banned-unless-tactical words ==="
          grep -linE '\b(solutions?|synergy|leverage|empowe?r|journey|holistic|tailored|bespoke|\bcoach(ing)?\b|transformational|world.class|unlock (your|their) potential)\b' pages_html/*.html || echo "none found"
          echo
          echo "=== every h1 on every page ==="
          for f in pages_html/*.html; do
            echo "--- $f ---"
            grep -oE '<h1[^>]*>[^<]*' "$f" | sed 's/<[^>]*>//' || echo "(no h1 match)"
          done
      - name: Show full firefighting context lines
        run: |
          grep -noE '.\{0,80\}fire[a-z]*.\{0,80\}' pages_html/*.html 2>/dev/null | grep -i fire || true
