name: check-insights-instance
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch websites-and-ai page and inspect the insights section
        run: |
          curl -s https://www.arringtonconsultancy.com/websites-and-ai -o page.html
          echo "--- data-section-id for insights blocks ---"
          grep -oE 'data-section-id="insights[^"]*"' page.html | sort -u
          echo "--- insight-tag / h3 pairs in document order ---"
          grep -oE '<p class="insight-tag">[^<]*</p>|<h3>[^<]*</h3>' page.html
