name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Diagnose Railway target (no secret values printed)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "== railway --version =="
          railway --version || true
          echo "== railway whoami =="
          railway whoami || true
          echo "== railway status =="
          railway status || true
          echo "== railway status --json =="
          railway status --json || true
          echo "== railway service (list services in linked project) =="
          railway service || true
          echo "== railway environment (list environments) =="
          railway environment || true
          echo "== railway variables --service arrington-prototype --environment production --json (names/lengths/prefix only, no values) =="
          railway variables --service arrington-prototype --environment production --json > /tmp/vars.json 2> /tmp/vars.err || true
          cat /tmp/vars.err || true
          node -e "
            try {
              const raw = require('fs').readFileSync('/tmp/vars.json', 'utf8');
              const vars = JSON.parse(raw);
              for (const [k, v] of Object.entries(vars)) {
                const s = String(v ?? '');
                console.log(k, '| length=' + s.length, '| prefix=' + (s.slice(0, 13) || '(empty)'));
              }
            } catch (e) {
              console.log('Could not parse railway variables output:', e.message);
            }
          "

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service arrington-prototype --environment production --detach

      - name: Live-test ANTHROPIC_API_KEY (temporary — see server.js /api/_test/anthropic)
        run: |
          URL=https://www.arringtonconsultancy.com/api/_test/anthropic
          for i in $(seq 1 10); do
            echo "Attempt $i..."
            HTTP_CODE=$(curl -sS --max-time 20 -o /tmp/anthropic_test.json -w "%{http_code}" "$URL" || echo "000")
            echo "HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "== Response =="
              cat /tmp/anthropic_test.json
              exit 0
            fi
            sleep 10
          done
          echo "Gave up after 10 attempts — new container may not have come up in time."
