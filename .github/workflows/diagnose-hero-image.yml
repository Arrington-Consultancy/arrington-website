name: Diagnose hero image on Websites and AI page (read-only, temporary)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download the actual bytes being served
        run: |
          curl -sS -o headshot.webp https://www.arringtonconsultancy.com/img/headshot.webp
          curl -sS -o headshot-base.jpg https://www.arringtonconsultancy.com/img/headshot
          curl -sS -o hero5.webp https://www.arringtonconsultancy.com/img/headshot__hero__5.webp
          echo "== sizes =="
          ls -la headshot.webp headshot-base.jpg hero5.webp
          echo "== md5 (hero5.webp vs headshot.webp - do they match?) =="
          md5sum headshot.webp hero5.webp

      - name: Set up Python image lib
        run: pip install --quiet Pillow

      - name: Print small base64 thumbnails to the log for visual inspection
        run: |
          python3 -c "
          from PIL import Image
          import base64, io
          for name in ['headshot.webp', 'headshot-base.jpg', 'hero5.webp']:
              im = Image.open(name).convert('RGB')
              im.thumbnail((240, 240))
              buf = io.BytesIO()
              im.save(buf, format='JPEG', quality=70)
              b64 = base64.b64encode(buf.getvalue()).decode()
              print(f'=== {name} ({im.size[0]}x{im.size[1]}) ===')
              print(b64)
              print()
          "
