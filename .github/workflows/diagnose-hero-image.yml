name: Diagnose hero image on Websites and AI page (read-only, temporary)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download the actual bytes being served
        run: |
          curl -sS -o headshot.webp https://www.arringtonconsultancy.com/img/headshot.webp
          curl -sS -o headshot-base.jpg https://www.arringtonconsultancy.com/img/headshot
          curl -sS -o hero5.webp https://www.arringtonconsultancy.com/img/headshot__hero__5.webp
          curl -sS -o hero5.jpg https://www.arringtonconsultancy.com/img/headshot__hero__5
          ls -la headshot.webp headshot-base.jpg hero5.webp hero5.jpg

      - name: Set up Python image lib
        run: pip install --quiet Pillow imagehash

      - name: Compare perceptual hashes and average colours (compact, copy-safe output)
        run: |
          python3 -c "
          from PIL import Image
          import imagehash
          files = ['headshot.webp', 'headshot-base.jpg', 'hero5.webp', 'hero5.jpg']
          for name in files:
              im = Image.open(name).convert('RGB')
              h = imagehash.average_hash(im)
              small = im.resize((3,3))
              pixels = list(small.getdata())
              print(name, 'size=', im.size, 'ahash=', str(h), 'pixels=', pixels)
          "
