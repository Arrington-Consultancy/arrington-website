name: full-review
on:
  workflow_dispatch: {}
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          npm init -y --silent >/dev/null 2>&1
          npm install --no-save playwright@1 --silent >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Take key screenshots
        timeout-minutes: 5
        run: node .tmp-review-scripts/key-shots.js
      - name: Commit screenshots to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add review-shots/
          git commit -m "Add key review screenshots [skip ci]" || echo "nothing to commit"
          git push
