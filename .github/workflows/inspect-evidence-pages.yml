name: Inspect Evidence source pages (read-only, temporary)

# Manual-only, one-off diagnostic: reads the live content of the three pages
# proposed for merging into a new Evidence page (What We Have Done, What the
# Work Looks Like, What Business Owners Say), so the merge can be designed
# against what's actually there instead of guessing. Strictly read-only —
# see scripts/inspect-evidence-pages.js, no INSERT/UPDATE/DELETE anywhere in
# it. Uses `railway run` (not `railway up`) so nothing is deployed; this only
# executes a one-off Node process against the linked service's database with
# its env vars injected. Delete this workflow once the Evidence merge is
# built and no longer needed.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev --omit=optional || npm install --omit=dev

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Run read-only inspection against production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway run --service arrington-prototype --environment production -- node scripts/inspect-evidence-pages.js
