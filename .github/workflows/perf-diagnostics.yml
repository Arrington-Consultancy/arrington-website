name: perf-diagnostics
on:
  workflow_dispatch: {}
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          npm init -y --silent >/dev/null 2>&1
          npm install --no-save lighthouse@11 chrome-launcher@1 --silent >/dev/null 2>&1
      - name: Run Lighthouse against home and evidence
        run: |
          mkdir -p perf-output
          for p in "" "evidence"; do
            name=$(echo "$p" | tr '/' '_')
            [ -z "$name" ] && name="home"
            timeout 90 npx lighthouse "https://www.arringtonconsultancy.com/$p" \
              --output=json --output-path="perf-output/lh-${name}.json" \
              --chrome-flags="--headless --no-sandbox" --quiet --only-categories=performance \
              || echo "lighthouse failed or timed out for $p"
          done
      - name: Print full diagnostics
        run: |
          for f in perf-output/lh-*.json; do
            node .tmp-perf-scripts/print-lh-diagnostics.js "$(pwd)/$f"
          done
