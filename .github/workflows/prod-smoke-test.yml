name: prod-smoke-test
on:
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Ride out Railway's post-deploy settle window
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://www.arringtonconsultancy.com/health)
            echo "attempt $i: /health -> $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done

      - name: Security headers on main page
        run: |
          curl -sD - -o /dev/null https://www.arringtonconsultancy.com/ | grep -iE "^HTTP|content-security-policy|permissions-policy|strict-transport-security|x-frame-options|x-content-type-options"

      - name: Confirm no inline style= remains on the fixed pages
        run: |
          for p in market-ready-test market-ready-test/result commercial-gaps-review owner-dependency-quiz owner-check; do
            echo "=== /$p ==="
            curl -s "https://www.arringtonconsultancy.com/$p" -o page.html
            grep -oE '<[a-z]+[^>]*style="[^"]*"' page.html | grep -v '^\s*$' || echo "(none found - clean)"
          done

      - name: Honeypot markup + CSS-class check on Market Ready Test
        run: |
          curl -s https://www.arringtonconsultancy.com/market-ready-test -o mrt.html
          echo "--- honeypot div (should have no inline style attribute) ---"
          grep -oE '<div class="mrt-hp"[^>]*>' mrt.html
          echo "--- .mrt-hp CSS rule present in <style> block ---"
          grep -oE '\.mrt-hp\s*\{[^}]*\}' mrt.html

      - name: Sitemap includes /owner-check
        run: |
          curl -s https://www.arringtonconsultancy.com/sitemap.xml

      - name: robots.txt unaffected
        run: |
          curl -s https://www.arringtonconsultancy.com/robots.txt

      - name: Admin API still gated (GET only, no writes)
        run: |
          for p in /api/admin/leads /api/admin/pages /api/content/contact; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.arringtonconsultancy.com$p")
            echo "GET $p -> $code"
          done

      - name: Install Playwright and check every public page for real CSP console violations
        run: |
          npm init -y --silent >/dev/null 2>&1
          npm install --no-save playwright@1 --silent >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > check.js <<'EOF'
          const { chromium } = require('playwright');
          const BASE = 'https://www.arringtonconsultancy.com';
          const pages = ['/', '/what-we-do', '/websites-and-ai', '/evidence', '/about-us',
            '/book-a-30-minute-conversation', '/useful-thinking', '/owner-check',
            '/owner-dependency-quiz', '/market-ready-test', '/commercial-gaps-review',
            '/business-consultant-devon', '/login'];
          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext();
            let totalViolations = 0;
            for (const p of pages) {
              const page = await context.newPage();
              const violations = [];
              page.on('console', msg => {
                const t = msg.text();
                if (t.includes('Content Security Policy') || t.includes('Refused to')) violations.push(t);
              });
              try {
                await page.goto(BASE + p, { waitUntil: 'domcontentloaded', timeout: 20000 });
                await page.waitForTimeout(1500);
              } catch (e) {
                console.log(p, 'LOAD ERROR', e.message);
              }
              console.log(p, ':', violations.length, 'violation(s)');
              violations.forEach(v => console.log('   ', v.split('\n')[0]));
              totalViolations += violations.length;
              await page.close();
            }
            await browser.close();
            console.log('TOTAL_VIOLATIONS:', totalViolations);
          })();
          EOF
          node check.js
