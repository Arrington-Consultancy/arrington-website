name: Verify final hero photo state (read-only, temporary)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check both JPEG and WebP paths match the new photo, not the old default
        run: |
          for i in 1 2 3 4 5; do
            j=$(curl -sS -o /dev/null -w "%{http_code} %{size_download}" https://www.arringtonconsultancy.com/img/headshot__hero__5)
            w=$(curl -sS -o /dev/null -w "%{http_code} %{size_download}" https://www.arringtonconsultancy.com/img/headshot__hero__5.webp)
            echo "attempt $i: jpeg=[$j] webp=[$w]"
            jcode=$(echo "$j" | cut -d' ' -f1)
            wcode=$(echo "$w" | cut -d' ' -f1)
            if [ "$jcode" = "200" ] && [ "$wcode" = "200" ]; then break; fi
            sleep 5
          done
          echo "== expect jpeg size 129018, webp size 57232 (the new photo, not the old ~203278/96316 default) =="
