name: verify-fixes
on:
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check deployed fixes on production
        run: |
          BASE="https://www.arringtonconsultancy.com"
          echo "=== homepage og:image / twitter:image ==="
          curl -s "$BASE/" | grep -oE '<meta property="og:image"[^>]*>|<meta name="twitter:image"[^>]*>'
          echo
          echo "=== business-consultant-devon voice check ==="
          curl -s "$BASE/business-consultant-devon" | grep -oE 'Tom was brought|Tom rebuilt|I was brought|I rebuilt|constant firefighting|constant intervention|Separately, Tom built|Separately, I built'
          echo
          echo "=== owner-check tags ==="
          curl -s "$BASE/owner-check" | grep -oE '<link rel="canonical"[^>]*>|<meta property="og:image"[^>]*>|<meta name="twitter:card"[^>]*>'
          echo
          echo "=== owner-dependency-quiz tags ==="
          curl -s "$BASE/owner-dependency-quiz" | grep -oE '<link rel="canonical"[^>]*>|<meta property="og:image"[^>]*>|<meta name="twitter:card"[^>]*>'
          echo
          echo "=== commercial-gaps-review tags ==="
          curl -s "$BASE/commercial-gaps-review" | grep -oE '<link rel="canonical"[^>]*>|<meta property="og:title"[^>]*>|<meta property="og:image"[^>]*>|<meta name="twitter:card"[^>]*>'
          echo
          echo "=== sitemap lastmod for 3 assessment routes ==="
          curl -s "$BASE/sitemap.xml" | grep -A1 -E "owner-check|owner-dependency-quiz|commercial-gaps-review"
          echo
          echo "=== evidence anchors present ==="
          curl -s "$BASE/evidence" | grep -oE 'id="biography__2"|id="casestudy__4"|id="casestudy2__2"' | sort -u
