name: Verify Websites and AI hero photo live

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check hero image byte size (should be ~129KB, not the ~1.4MB PNG fallback)
        run: |
          for i in 1 2 3 4 5; do
            info=$(curl -sS -o img.bin -w "%{http_code} %{content_type} %{size_download}" https://www.arringtonconsultancy.com/img/headshot__hero__5)
            echo "attempt $i: $info"
            code=$(echo "$info" | cut -d' ' -f1)
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done

      - name: Check the page references the right image key
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o wai.html -w "%{http_code}" https://www.arringtonconsultancy.com/websites-and-ai)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          grep -oE 'src="/img/headshot[^"]*"' wai.html
