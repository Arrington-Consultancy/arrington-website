name: verify-insights-links
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ride out post-deploy settle window
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://www.arringtonconsultancy.com/health)
            echo "attempt $i: /health -> $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
      - name: Confirm insights cards link correctly on the live site
        run: |
          curl -s https://www.arringtonconsultancy.com/websites-and-ai -o page.html
          grep -oE '<p class="insight-tag">[^<]*</p>|<h3><a href="[^"]*">[^<]*</a></h3>|<h3>[^<]*</h3>' page.html
