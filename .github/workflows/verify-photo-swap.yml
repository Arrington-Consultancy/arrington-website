name: Verify hero photo swap live (read-only, temporary)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check image sizes match the new photo
        run: |
          for i in 1 2 3 4 5; do
            j=$(curl -sS -o /dev/null -w "%{http_code} %{size_download}" https://www.arringtonconsultancy.com/img/headshot__hero__5)
            w=$(curl -sS -o /dev/null -w "%{http_code} %{size_download}" https://www.arringtonconsultancy.com/img/headshot__hero__5.webp)
            echo "attempt $i: jpeg=[$j] webp=[$w]"
            jcode=$(echo "$j" | cut -d' ' -f1)
            if [ "$jcode" = "200" ]; then break; fi
            sleep 5
          done
          echo "== expect jpeg 125722, webp 53500 (the swapped-in photo) =="
