name: verify-ut
on:
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          npm init -y --silent >/dev/null 2>&1
          npm install --no-save playwright@1 --silent >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run verification
        timeout-minutes: 4
        run: node .tmp-verify-scripts/verify-ut.js
